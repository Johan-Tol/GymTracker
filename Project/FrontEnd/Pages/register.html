<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Style/style.css">
    <title>Register</title>
</head>
<body>
    <div class="center">
        <div class="container border">
            <form class="column center space-around form" id="registerForm">
                <h1>Register</h1>
                <div><label for="Email">Email:</label><input type="email" id="email" placeholder="Email" required></div>
                <div><label for="Username">Username:</label><input type="text" id="username" placeholder="Username" required></div>
                <div><label for="Password">Password:</label><input type="password" id="password" placeholder="Password" required></div>
                <div><label for="ConfirmPassword">Confirm Password:</label><input type="password" id="confirmPassword" placeholder="Confirm Password" required></div>
                <button type="submit">Register</button>
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </form>
        </div>
    </div>
</body>
</html>

<script src="../Script/script.js"></script>
<script src="../Script/register.js" defer></script>
