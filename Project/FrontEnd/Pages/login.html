<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Style/style.css">
    <title>Login</title>
</head>
<body>
    <div class="center">
        <div class="container border">
            <form class="column center space-around form" id="loginForm">
                <h1>Login</h1>
                <div><label for="username">Username or Email:</label><input type="text" id="username" placeholder="Username or Email" required></div>
                <div><label for="password">Password:</label><input type="password" id="password" placeholder="Password" required></div>
                <button type="submit">Login</button>
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </form>
        </div>
    </div>
</body>
</html>

<script src="../Script/script.js"></script>
<script src="../Script/login.js" defer></script>
